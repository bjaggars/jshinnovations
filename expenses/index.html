<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/expenses/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSH Expenses</title>
<meta name="description" content="Receipt capture and expense reporting for Jaggars Software Holdings">
<meta name="theme-color" content="#0f3d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#f0f2ef; --line:#e2e5e0; --line-2:#d3d7d1;
  --ink:#16201d; --ink-2:#4a5652; --ink-3:#7c8783;
  --brand:#0f3d3a; --accent:#0d8a6a; --accent-ink:#ffffff; --accent-soft:#e3f3ed;
  --warn:#b45309; --warn-soft:#fdf1e2; --bad:#b42318; --bad-soft:#fdecea; --info:#2557c7; --info-soft:#e8eefc;
  --shadow:0 1px 2px rgba(16,24,20,.06),0 4px 16px rgba(16,24,20,.06);
  --r:14px; --r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --surface:#161c1a; --surface-2:#1d2421; --line:#28302d; --line-2:#36403c;
    --ink:#e9eeec; --ink-2:#b2bdb8; --ink-3:#83908b;
    --brand:#9fe0cb; --accent:#25b48c; --accent-ink:#04140f; --accent-soft:#143229;
    --warn:#f0a54a; --warn-soft:#33240f; --bad:#ff7b6e; --bad-soft:#3a1714; --info:#8fb0ff; --info-soft:#18233d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161c1a; --surface-2:#1d2421; --line:#28302d; --line-2:#36403c;
  --ink:#e9eeec; --ink-2:#b2bdb8; --ink-3:#83908b;
  --brand:#9fe0cb; --accent:#25b48c; --accent-ink:#04140f; --accent-soft:#143229;
  --warn:#f0a54a; --warn-soft:#33240f; --bad:#ff7b6e; --bad-soft:#3a1714; --info:#8fb0ff; --info-soft:#18233d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:15px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
:root[data-theme="dark"] .logo-mark{background:#0f3d3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-mark{background:#0f3d3a}}
.logo small{display:block;font-weight:500;color:var(--ink-3);font-size:11px;letter-spacing:.02em;text-transform:uppercase}
.top .spacer{flex:1}
.year-sel{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:120px;background:none;border:0;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.nav .cap{color:var(--ink-3)}
.nav .cap.on{color:var(--accent)}
.nav .cap .capdot{color:#fff;width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-top:-20px;box-shadow:var(--shadow);border:4px solid var(--surface)}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:220px}
  .nav{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 12px}
  .nav button{flex:none;max-width:none;flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;justify-content:flex-start}
  .nav button.on{background:var(--accent-soft)}
  .nav .badge{position:static;margin-left:auto}
  .nav .cap{color:var(--accent)}
  .nav .cap .capdot{width:24px;height:24px;margin:0;border:0;box-shadow:none}
  .nav .cap .capdot svg{width:16px;height:16px}
  .top{padding-left:236px;margin-left:-220px}
}

main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--ink-3)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack>*+*{margin-top:12px}
.grid{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.section-title h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* forms */
label.f{display:block}
label.f>span{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:4px;letter-spacing:.01em}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 11px;outline:none;min-height:40px}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid.r3{grid-template-columns:1fr 1fr}}
.fgrid.r3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* inbox */
.inbox-item{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px;border-bottom:1px solid var(--line)}
.inbox-item:last-child{border-bottom:0}
.thumb{width:84px;height:104px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;cursor:pointer;color:var(--ink-3)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:30px;height:30px}
.ii-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ii-vendor{font-weight:700;font-size:16px}
.ii-amt{font-weight:700;font-size:17px}
.ii-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ii-fields .in{min-height:36px;padding:6px 9px;font-size:14px}
.ii-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@media (max-width:520px){.ii-fields{grid-template-columns:1fr}.inbox-item{grid-template-columns:64px 1fr}.thumb{width:64px;height:84px}}

/* capture */
.cap-hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cap-btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;min-height:130px}
.cap-btn.main{background:var(--brand);color:#fff;border-color:transparent}
:root[data-theme="dark"] .cap-btn.main{background:#0f3d3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cap-btn.main{background:#0f3d3a}}
.cap-btn svg{width:30px;height:30px}
.cap-btn b{font-size:17px}
.cap-btn span{font-size:13px;opacity:.8}
.cap-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-3)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.q-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.q-item:last-child{border-bottom:0}
.q-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.q-item{flex-wrap:wrap}.q-item .q-name{flex:1 1 calc(100% - 90px);white-space:normal}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.intake-line{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.intake-line:first-child{border-top:0}
.intake-ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.intake-ico svg{width:20px;height:20px}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0}
.tbl-wrap{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--surface-2);min-width:60px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* expense list (mobile) */
.elist .e-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.elist .e-row:last-child{border-bottom:0}
.e-date{width:42px;text-align:center;flex:none;line-height:1.1}
.e-date b{display:block;font-size:17px}
.e-date span{font-size:11px;color:var(--ink-3);text-transform:uppercase;font-weight:600}
.e-main{flex:1;min-width:0}
.e-main .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-main .s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-amt{font-weight:700;text-align:right}
.only-wide{display:none}
@media (min-width:760px){.only-wide{display:block}.only-narrow{display:none}}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:180px;padding:10px 4px 0}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;gap:6px}
.chart .col .b{width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;opacity:.9}
.chart .col.dim .b{opacity:.25}
.chart .col.on .b{opacity:1;box-shadow:0 0 0 2px var(--accent-soft)}
.chart .col .v{font-size:10px;color:var(--ink-3);white-space:nowrap}
.chart-x{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;padding:6px 4px 0;font-size:11px;color:var(--ink-3);text-align:center;font-weight:600}
.qrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px 4px 0}
.qrow div{background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px;text-align:center;cursor:pointer}
.qrow div b{display:block;font-size:14px}
.qrow div.on{background:var(--accent-soft);color:var(--accent)}
.recur-dots{display:flex;gap:4px}
.recur-dots i{width:14px;height:14px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.recur-dots i.y{background:var(--accent);border-color:var(--accent)}
.recur-dots i.n{background:var(--bad-soft);border-color:var(--bad)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:18px;max-width:1040px;width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.narrow{max-width:520px}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{flex:1;font-size:17px}
.modal-body{overflow:auto;flex:1}
.modal-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.ed-prev{background:var(--surface-2);border-right:1px solid var(--line);min-height:420px;display:flex;flex-direction:column}
.ed-prev .pv{flex:1;display:grid;place-items:center;overflow:auto;padding:12px}
.ed-prev img{max-width:100%;border-radius:8px;box-shadow:var(--shadow)}
.ed-prev iframe{width:100%;height:100%;min-height:520px;border:0;background:#fff;border-radius:8px}
.ed-form{padding:16px}
@media (max-width:760px){
  .modal-bg{padding:0;align-items:stretch}
  .modal{max-height:none;height:100%;border-radius:0}
  .ed{grid-template-columns:1fr}
  .ed-prev{min-height:0;border-right:0;border-bottom:1px solid var(--line)}
  .ed-prev .pv{max-height:46vh}
  .ed-prev iframe{min-height:46vh}
}
.li-list{font-size:13px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li-list div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line)}
.li-list div:last-child{border-bottom:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
@media (min-width:900px){.toast{bottom:24px;margin-left:110px}}
.empty{padding:38px 20px;text-align:center;color:var(--ink-3)}
.empty svg{width:40px;height:40px;opacity:.6}
.empty b{display:block;color:var(--ink);font-size:16px;margin:8px 0 4px}
.auth{max-width:400px;margin:8vh auto;padding:0 16px}
.auth .card{padding:24px}
.code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;user-select:all}
.more-list button{display:flex;width:100%;align-items:center;gap:14px;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.more-list button:last-child{border-bottom:0}
.more-list svg{width:22px;height:22px;color:var(--accent)}
.more-list b{display:block}
.more-list span{font-size:13px;color:var(--ink-3)}
.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.filters .in{min-height:38px;padding:7px 10px;font-size:14px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo"><div class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9fe0cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></div><div>JSH Expenses<small id="who"></small></div></div>
  <div class="spacer"></div>
  <select class="year-sel hide" id="yearSel" aria-label="Tax year"></select>
</div></header>
<nav class="nav hide" id="nav"></nav>
<main id="main"><div class="empty"><div class="spin" style="margin:40px auto"></div></div></main>
<div id="modal"></div>
<div id="toast" class="toast hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ========= config ========= */
const SB_URL = "https://cfhualtyvccfjxenvkud.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmaHVhbHR5dmNjZmp4ZW52a3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTk2NjEsImV4cCI6MjEwODA5NTY2MX0.WOnjua0fxslAfkuHz_O8yKndfq86YDH4KLlqjqtdics";
const API = SB_URL + "/functions/v1/api";
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "jsh-expenses-auth", lock: async (_name, _timeout, fn) => await fn() } });
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);

/* ========= tiny helpers ========= */

function deductible(e) {
  if (e.total == null) return 0;
  const c = catById(e.category_id);
  const cp = c ? +c.deductible_pct : 100;
  const bp = e.business_pct == null || e.business_pct === "" ? 100 : +e.business_pct;
  return Math.round(e.total * bp / 100 * cp / 100 * 100) / 100;
}
function mileageRate(date) {
  const rates = (S.settings.mileage_rates || []).slice().sort((a, b) => a.from < b.from ? -1 : 1);
  let r = 0; for (const x of rates) if (date >= x.from) r = +x.rate; return r;
}

/* ========= data ========= */
async function fetchAll(build) {
  let out = [], from = 0; const size = 1000;
  for (;;) { const { data, error } = await build().range(from, from + size - 1); if (error) throw error; out = out.concat(data || []); if (!data || data.length < size) break; from += size; }
  return out;
}
async function loadAll() {
  const [cats, prods, cards, settings, expenses, receipts, mileage, lines, imports] = await Promise.all([
    sb.from("categories").select("*").order("sort"),
    sb.from("products").select("*").order("sort"),
    sb.from("payment_methods").select("*").order("label"),
    sb.from("settings").select("*"),
    fetchAll(() => sb.from("expenses_lite").select("*").order("date", { ascending: false, nullsFirst: true })),
    fetchAll(() => sb.from("receipts").select("id,storage_path,mime,source,original_name,from_address,email_subject,status,error,created_at").order("created_at", { ascending: false })),
    fetchAll(() => sb.from("mileage").select("*").order("date", { ascending: false })),
    fetchAll(() => sb.from("statement_lines").select("*").order("date", { ascending: false })),
    sb.from("statement_imports").select("*").order("created_at", { ascending: false }),
  ]);
  for (const r of [cats, prods, cards, settings, imports]) if (r.error) throw r.error;
  S.cats = cats.data; S.prods = prods.data; S.cards = cards.data; S.imports = imports.data;
  S.settings = Object.fromEntries(settings.data.map((s) => [s.key, s.value]));
  S.expenses = expenses; S.receipts = receipts; S.mileage = mileage; S.lines = lines;
  buildYearSel();
}

async function api(path, body) {
  let session = null; try { session = (await withTimeout(sb.auth.getSession(), 5000, "t")).data.session; } catch {}
  const res = await fetch(API + "/" + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + (session?.access_token || SB_KEY) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = {}; try { j = await res.json(); } catch {}
  if (!res.ok || j.error) throw new Error(j.error || ("Request failed (" + res.status + ")"));
  return j;
}
async function signedUrl(path) {
  if (!path) return null;
  const c = S.urls.get(path); if (c && c.exp > Date.now()) return c.url;
  const { data, error } = await sb.storage.from("receipts").createSignedUrl(path, 3600);
  if (error) return null;
  S.urls.set(path, { url: data.signedUrl, exp: Date.now() + 3500e3 });
  return data.signedUrl;
}
async function hydrateThumbs(root = document) {
  for (const el of $$("[data-thumb]", root)) {
    const r = recById(el.dataset.thumb); if (!r) continue;
    if (r.mime && r.mime.startsWith("image/")) { const u = await signedUrl(r.storage_path); if (u) el.innerHTML = `<img alt="Receipt" loading="lazy" src="${esc(u)}">`; }
  }
}

/* ========= boot / auth ========= */
async function boot() {
  let session = null;
  try { session = (await withTimeout(sb.auth.getSession(), 8000, "session check timed out")).data.session; } catch (e) { console.warn(e); }
  S.session = session;
  sb.auth.onAuthStateChange((ev, s) => { S.session = s; if (ev === "SIGNED_OUT") location.reload(); });
  if (!session) return renderAuth();
  const { data: me } = await sb.from("members").select("*").eq("user_id", session.user.id).maybeSingle();
  if (!me) { $("#main").innerHTML = `<div class="auth"><div class="card stack"><h2>No access</h2><p class="muted">${esc(session.user.email)} isn't set up for these books.</p><button class="btn" data-act="signout">Sign out</button></div></div>`; return; }
  S.me = me; S.owner = me.role === "owner";
  $("#who").textContent = S.owner ? "Owner" : "Accountant · read only";
  S.view = S.owner ? (location.hash.slice(1) || "inbox") : (["reports","expenses","mileage","more","statements"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "reports");
  await loadAll();
  $("#nav").classList.remove("hide"); $("#yearSel").classList.remove("hide");
  render();
  sb.channel("live").on("postgres_changes", { event: "*", schema: "public", table: "expenses" }, softReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "receipts" }, softReload).subscribe();
  if (S.owner) pickUpShared();
}
// Direct password sign-in (no library locks): store the session where supabase-js reads it, then reload.
async function passwordSignIn(email, password) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
  let res;
  try {
    res = await fetch(SB_URL + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ email, password }), signal: ctl.signal });
  } catch (e) { throw new Error(e.name === "AbortError" ? "Sign-in timed out: the server didn't answer in 20 seconds." : "Couldn't reach the server (" + e.message + ")."); }
  finally { clearTimeout(t); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(/invalid/i.test(j.error_description || j.msg || "") ? "Wrong email or password." : (j.error_description || j.msg || j.message || "Sign-in failed (" + res.status + ")"));
  j.expires_at = j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600);
  localStorage.setItem("jsh-expenses-auth", JSON.stringify(j));
}

    <form id="authForm" class="stack">

      <label class="f"><span>Password${needsSetup ? " (10+ characters)" : ""}</span><input class="in" name="password" type="password" autocomplete="${needsSetup ? "new-password" : "current-password"}" required minlength="${needsSetup ? 10 : 1}"></label>
      <button class="btn primary" style="width:100%">${needsSetup ? "Create account" : "Sign in"}</button>
      <p class="small" id="authErr" style="color:var(--bad)"></p>
    </form></div></div>`;
  $("#authForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target)); const btn = ev.target.querySelector("button"); btn.disabled = true; $("#authErr").textContent = "";

    } catch (e) { $("#authErr").textContent = e.message; btn.disabled = false; btn.textContent = needsSetup ? "Create account" : "Sign in"; }
  };
}

function buildYearSel() {
  const ys = new Set([new Date().getFullYear(), S.year]);
  for (const e of S.expenses) if (e.date) ys.add(yOf(e.date));
  for (const m of S.mileage) ys.add(yOf(m.date));
  const sel = $("#yearSel");
  sel.innerHTML = [...ys].filter(Boolean).sort((a, b) => b - a).map((y) => `<option ${y === S.year ? "selected" : ""}>${y}</option>`).join("");
  sel.onchange = () => { S.year = +sel.value; render(); };
}
function inboxCount() { return S.expenses.filter((e) => e.status === "review").length + S.receipts.filter((r) => r.status === "error").length; }

/* ========= INBOX ========= */
function viewInbox() {
  const review = S.expenses.filter((e) => e.status === "review").sort((a, b) => (b.created_at > a.created_at ? 1 : -1));
  const reading = S.receipts.filter((r) => r.status === "pending" || r.status === "processing");
  const failed = S.receipts.filter((r) => r.status === "error");
  let h = `<div class="page-head"><div><h2>Inbox</h2><p>${review.length ? `${review.length} to confirm. Check the amount and category, then file.` : "Nothing waiting. New receipts land here when the reader isn't sure."}</p></div>
    <button class="btn primary" data-go="capture">${IC.camera} Add receipt</button></div>`;
  if (reading.length) h += `<div class="card pad row" style="margin-bottom:12px"><div class="spin"></div><div><b>Reading ${reading.length} receipt${reading.length > 1 ? "s" : ""}…</b><div class="small muted">They'll appear below or file themselves when done.</div></div></div>`;
  if (failed.length) h += `<div class="section-title"><h3>Couldn't read</h3></div><div class="card">${failed.map((r) => `
    <div class="q-item"><span class="chip bad">Error</span><div class="q-name"><b>${esc(r.email_subject || r.original_name || "Receipt")}</b><div class="small muted">${esc(r.error || "")}</div></div>
    <button class="btn sm" data-act="viewrec" data-id="${r.id}">View</button><button class="btn sm" data-act="retry" data-id="${r.id}">Retry</button><button class="btn sm danger" data-act="delrec" data-id="${r.id}">Delete</button></div>`).join("")}</div>`;
  if (!review.length && !failed.length && !reading.length) {
    h += `<div class="card empty">${IC.check}<b>All caught up</b>Snap a receipt, forward an email, or text a photo. Anything the reader is sure about files itself.</div>`;
    return h + recentFiled();
  }
  if (review.length) h += `<div class="section-title"><h3>To confirm</h3>${review.length > 1 ? `<button class="btn sm" data-act="fileready">File all that are complete</button>` : ""}</div><div class="card">${review.map(inboxItem).join("")}</div>`;
  return h + recentFiled();
}
function recentFiled() {
  const recent = S.expenses.filter((e) => e.status === "filed").sort((a, b) => (b.updated_at > a.updated_at ? 1 : -1)).slice(0, 6);
  if (!recent.length) return "";
  return `<div class="section-title"><h3>Recently filed</h3><button class="btn sm ghost" data-go="expenses">See all</button></div><div class="card elist">${recent.map(expRow).join("")}</div>`;
}
function inboxItem(e) {
  const c = catById(e.category_id);
  const isMeal = c && /meal/i.test(c.name);

function refreshQueue() { const el = $("#queue"); if (el && S.view === "capture") el.innerHTML = S.queue.map(qItem).join(""); else if (S.view === "capture") render(); }
function wireCapture() {
  const add = (files) => { if (files?.length) enqueue([...files], "upload"); };
  $("#camIn").onchange = (ev) => { enqueue([...ev.target.files], "camera"); ev.target.value = ""; };

let running = 0;
function enqueue(files, source) {
  for (const f of files) S.queue.unshift({ id: uuid(), file: f, name: f.name || "Photo", source, state: "wait" });
  if (S.view !== "capture") go("capture"); else render();
  pump();
}
async function pump() {
  while (running < 3) {
    const job = [...S.queue].reverse().find((x) => x.state === "wait"); if (!job) break;
    running++; job.state = "up"; refreshQueue();
    processJob(job).finally(() => { running--; refreshQueue(); pump(); if (!S.queue.some((x) => ["wait", "up", "read"].includes(x.state))) finishBatch(); });
  }
}
async function finishBatch() { await loadAll(); await runMatching(true); renderNav(); if (S.view !== "capture") render(); }
async function processJob(job) {
  try {
    let rid;
    try { rid = await storeFile(job.file, job.source); }
    catch (e) { if (e.dup) { job.state = "dup"; return; } throw e; }
    job.state = "read"; refreshQueue();
    const out = await api("extract", { receipt_id: rid });
    const ex = out.expenses || [];
    const allFiled = ex.length && ex.every((e) => e.status === "filed");
    job.state = allFiled ? "done" : "review";
    job.msg = ex.map((e) => money(e.total)).join(" + ") + (allFiled ? " filed" : " · confirm");
    job.detail = ex.map((e) => e.vendor || "Unknown").join(", ");
  } catch (e) { job.state = "err"; job.msg = e.message; }
}
async function prepFile(file) {
  const type = (file.type || "").toLowerCase();
  if (type === "application/pdf" || /\.pdf$/i.test(file.name)) return { blob: file, mime: "application/pdf", ext: "pdf" };
  const draw = (src) => {
    const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
    const s = Math.min(1, 2200 / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return new Promise((r) => c.toBlob(r, "image/jpeg", 0.86));
  };
  try { const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); return { blob: await draw(bmp), mime: "image/jpeg", ext: "jpg" }; }
  catch {
    try {
      const url = URL.createObjectURL(file); const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      return { blob: await draw(img), mime: "image/jpeg", ext: "jpg" };
    } catch {
      if (["image/jpeg", "image/png", "image/webp", "image/gif"].includes(type)) return { blob: file, mime: type, ext: type.split("/")[1] };
      throw new Error("This browser can't open that image type. Export it as JPG or PDF.");
    }
  }
}
async function storeFile(file, source) {
  const { blob, mime, ext } = await prepFile(file);
  const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", await blob.arrayBuffer()))].map((b) => b.toString(16).padStart(2, "0")).join("");
  const { data: dup } = await sb.from("receipts").select("id").eq("file_hash", hash).limit(1);
  if (dup?.length) { const err = new Error("Already uploaded"); err.dup = true; throw err; }
  const d = new Date(); const path = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${uuid()}.${ext}`;
  const up = await sb.storage.from("receipts").upload(path, blob, { contentType: mime });
  if (up.error) throw new Error("Upload failed: " + up.error.message);
  const { data, error } = await sb.from("receipts").insert({ storage_path: path, mime, file_hash: hash, original_name: file.name || null, source }).select("id").single();
  if (error) throw error;
  return data.id;
}
async function pickUpShared() {
  if (!new URLSearchParams(location.search).has("shared") || !("caches" in window)) return;
  try {
    const cache = await caches.open("share-inbox"); const keys = await cache.keys(); const files = [];
    for (const k of keys) { const res = await cache.match(k); const b = await res.blob(); files.push(new File([b], decodeURIComponent(res.headers.get("x-name") || "shared"), { type: b.type })); await cache.delete(k); }
    history.replaceState(null, "", location.pathname + "#capture");
    if (files.length) enqueue(files, "upload");
  } catch (e) { console.warn(e); }
}

function periodRows() {

}
function periodLabel() { const p = S.rp.period; return p === "year" ? String(S.year) : p[0] === "Q" ? `${p} ${S.year}` : `${MONTHS[+p.slice(1) - 1]} ${S.year}`; }
function groupRows(rows, by) {

function recurring() {

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
function parseDate(s) {
  s = String(s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`; }
  const d = new Date(s); return isNaN(d) ? null : d.toLocaleDateString("en-CA");
}
const money2 = (s) => { const t = String(s || "").replace(/[$,\s]/g, ""); if (!t) return null; const neg = /^\(.*\)$/.test(t) || t.startsWith("-"); const v = parseFloat(t.replace(/[()\-]/g, "")); return isNaN(v) ? null : neg ? -v : v; };
async function importStatement() {
  let cardId = $("#stCard").value; const file = $("#stFile").files[0];
  if (!cardId) return toast("Pick the card first");
  if (!file) return toast("Choose the CSV file");
  const rows = parseCSV(await file.text());
  const hi = rows.findIndex((r) => r.some((c) => /date/i.test(c)));
  if (hi < 0) return toast("Couldn't find a header row with a Date column");
  const H = rows[hi].map((h) => h.trim().toLowerCase());
  const find = (re, not) => H.findIndex((h) => re.test(h) && !(not && not.test(h)));
  const di = [find(/trans.*date/), find(/^date$/), find(/date/, /post/), find(/date/)].find((x) => x >= 0);
  const desc = [find(/desc/), find(/merchant|payee|name|details|memo/)].find((x) => x >= 0);
  const ai = find(/^amount|amount$|amount \(/); const dbi = find(/debit|withdraw|charge/); const cri = find(/credit|deposit|payment/, /card/);
  if (di < 0 || desc < 0 || (ai < 0 && dbi < 0)) return toast("Couldn't read the columns. Expected Date, Description, Amount.");
  let parsed = rows.slice(hi + 1).map((r) => {
    const date = parseDate(r[di]); let amt;
    if (ai >= 0) amt = money2(r[ai]); else { const d = money2(r[dbi]), c = money2(r[cri]); amt = d ? Math.abs(d) : c ? -Math.abs(c) : null; }
    return { date, description: (r[desc] || "").trim(), amount: amt };
  }).filter((x) => x.date && x.amount != null);
  if (ai >= 0) { const neg = parsed.filter((x) => x.amount < 0).length; if (neg > parsed.length / 2) parsed = parsed.map((x) => ({ ...x, amount: -x.amount })); }
  if (!parsed.length) return toast("No transactions found in that file");
  const { data: imp, error } = await sb.from("statement_imports").insert({ file_name: file.name, payment_method_id: cardId }).select().single();
  if (error) return toast(error.message);
  const recs = parsed.map((x) => {
    const pay = x.amount <= 0 || /payment|autopay|thank you|online transfer|balance transfer/i.test(x.description);
    return { import_id: imp.id, date: x.date, description: x.description, amount: Math.round(x.amount * 100) / 100, payment_method_id: cardId, ignored: pay, ignore_reason: pay ? "payment/credit" : null };
  });
  // skip lines already imported for this card
  const have = new Set(S.lines.filter((l) => l.payment_method_id === cardId).map((l) => `${l.date}|${l.amount}|${l.description}`));
  const fresh = recs.filter((r) => !have.has(`${r.date}|${r.amount}|${r.description}`));
  for (let i = 0; i < fresh.length; i += 500) { const { error: e2 } = await sb.from("statement_lines").insert(fresh.slice(i, i + 500)); if (e2) return toast(e2.message); }
  await loadAll(); const n = await runMatching(true); render();
  toast(`Imported ${fresh.length} charges${recs.length - fresh.length ? ` (${recs.length - fresh.length} already there)` : ""} · ${n} matched`);
}
async function runMatching(quiet) {
  if (!S.owner || !S.lines.length) return 0;
  const taken = new Set(S.lines.filter((l) => l.matched_expense_id).map((l) => l.matched_expense_id));
  const updates = [];
  for (const l of S.lines) {
    if (l.matched_expense_id || l.ignored) continue;
    const card = cardById(l.payment_method_id);
    const cands = S.expenses.filter((e) => !taken.has(e.id) && e.date && e.total != null && Math.abs(+e.total - +l.amount) < 0.011 && dayDiff(e.date, l.date) <= 5);
    if (!cands.length) continue;
    cands.sort((a, b) => ((card?.last4 && a.card_last4 === card.last4 ? -10 : 0) + dayDiff(a.date, l.date)) - ((card?.last4 && b.card_last4 === card.last4 ? -10 : 0) + dayDiff(b.date, l.date)));
    const best = cands[0]; taken.add(best.id); l.matched_expense_id = best.id; updates.push([l.id, best.id, best]);
  }
  for (let i = 0; i < updates.length; i += 15) await Promise.all(updates.slice(i, i + 15).map(([lid, eid, e]) => Promise.all([
    sb.from("statement_lines").update({ matched_expense_id: eid }).eq("id", lid),
    !e.payment_method_id ? sb.from("expenses").update({ payment_method_id: S.lines.find((x) => x.id === lid).payment_method_id }).eq("id", eid) : null,
  ])));
  if (!quiet) toast(`${updates.length} new matches`);
  return updates.length;
}
function guessFromHistory(desc) {
  const k = vkey(desc).slice(0, 6); if (!k) return {};
  const hit = S.expenses.find((e) => e.status === "filed" && e.vendor_key && (e.vendor_key.startsWith(k) || k.startsWith(e.vendor_key.slice(0, 6))));
  return hit ? { vendor: hit.vendor, category_id: hit.category_id, product_id: hit.product_id } : {};
}
function cleanDesc(d) { return String(d || "").replace(/\s{2,}.*$/, "").replace(/[*#]\S*/g, "").replace(/\b\d{5,}\b/g, "").replace(/\s+/g, " ").trim().replace(/\b\w/g, (c) => c.toUpperCase()).replace(/\B\w+/g, (w) => w.toLowerCase()); }

function readyToFile(e) { return e.total != null && e.date && e.category_id; }
document.addEventListener("click", async (ev) => {
  const g = ev.target.closest("[data-go]"); if (g) { ev.preventDefault(); go(g.dataset.go); return; }
  const rp = ev.target.closest("[data-rp]"); if (rp) { S.rp.period = S.rp.period === rp.dataset.rp && rp.dataset.rp !== "year" ? "year" : rp.dataset.rp; render(); return; }
  const rg = ev.target.closest("[data-rg]"); if (rg) { S.rp.group = rg.dataset.rg; render(); return; }
  const dr = ev.target.closest("[data-drill]"); if (dr) {
    const f = JSON.parse(dr.dataset.drill); const p = S.rp.period;
    S.ef = { q: "", month: p === "year" ? "" : p[0] === "Q" ? p : p.slice(1), cat: "", prod: "", vendor: "", card: "", status: "filed", ...f };
    go("expenses"); return;
  }
  const a = ev.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === "closebg" && ev.target !== a) return;
  if (a.tagName === "A") ev.preventDefault();
  try {
    switch (act) {
      case "close": case "closebg": closeModal(); break;
      case "signout": await sb.auth.signOut(); break;
      case "edit": openEditor(id); break;
      case "manual": openManual(); break;
      case "file": {
        const row = a.closest("[data-row]"); const patch = {};
        for (const el of $$("[data-f]", row)) patch[el.dataset.f] = el.dataset.f === "total" ? num(el.value) : (el.value || null);
        const e = { ...expById(id), ...patch };
        if (!readyToFile(e)) { toast("Needs an amount, date and category"); break; }
        patch.status = "filed"; await updateExp(id, patch); toast(`Filed ${e.vendor || ""} ${money(e.total)}`); render(); break;
      }
      case "fileready": {
        const ready = S.expenses.filter((e) => e.status === "review" && readyToFile(e) && !e.duplicate_of);
        await Promise.all(ready.map((e) => updateExp(e.id, { status: "filed" }))); toast(`Filed ${ready.length}`); render(); break;
      }
      case "delexp": if (!confirm("Delete this expense?")) break; { const e = expById(id); await sb.from("statement_lines").update({ matched_expense_id: null }).eq("matched_expense_id", id); await sb.from("expenses").delete().eq("id", id); if (e?.receipt_id && !S.expenses.some((x) => x.id !== id && x.receipt_id === e.receipt_id)) await deleteReceipt(e.receipt_id); closeModal(); await loadAll(); render(); toast("Deleted"); } break;
      case "deldup": { const e = expById(id); await sb.from("expenses").delete().eq("id", id); if (e?.receipt_id && !S.expenses.some((x) => x.id !== id && x.receipt_id === e.receipt_id)) await deleteReceipt(e.receipt_id); await loadAll(); render(); toast("Duplicate removed"); } break;
      case "notdup": { const e = expById(id); await updateExp(id, { duplicate_of: null, ai_flags: (e.ai_flags || []).filter((f) => !/duplicate/i.test(f)) }); render(); } break;
      case "edsave": {
        const f = Object.fromEntries(new FormData($("#edForm")));
        const patch = { vendor: f.vendor || null, date: f.date || null, total: num(f.total), subtotal: num(f.subtotal), tax: num(f.tax), tip: num(f.tip), category_id: f.category_id || null, product_id: f.product_id || null, payment_method_id: f.payment_method_id || null, description: f.description || null, business_pct: num(f.business_pct) ?? 100, business_purpose: f.business_purpose || null, attendees: f.attendees || null, notes: f.notes || null };
        if (a.dataset.file === "1") { if (!readyToFile(patch)) { toast("Needs an amount, date and category"); break; } patch.status = "filed"; } else patch.status = "review";
        await updateExp(id, patch); closeModal(); render(); toast(patch.status === "filed" ? "Saved and filed" : "Saved");
      } break;
      case "reread": { const e = expById(id); a.disabled = true; a.textContent = "Reading…"; const out = await api("extract", { receipt_id: e.receipt_id, replace: true }); await loadAll(); closeModal(); if (out.expenses?.[0]) openEditor(out.expenses[0].id); render(); toast("Re-read done"); } break;
      case "retry": { a.disabled = true; a.textContent = "Reading…"; try { await api("extract", { receipt_id: id }); toast("Read it"); } catch (e) { toast(e.message, 5000); } await loadAll(); render(); } break;
      case "delrec": if (!confirm("Delete this receipt file?")) break; await deleteReceipt(id); await loadAll(); render(); break;
      case "viewrec": { const r = recById(id); $("#modal").innerHTML = `<div class="modal-bg" data-act="closebg"><div class="modal"><div class="modal-head"><h3>${esc(r.email_subject || r.original_name || "Receipt")}</h3><button class="btn ghost sm" data-act="close">${IC.x}</button></div><div class="modal-body ed-prev" style="min-height:60vh"><div class="pv" id="pv"><div class="spin"></div></div></div></div></div>`; previewReceipt(r, $("#pv")); } break;
      case "mansave": {
        const form = $("#manForm"); if (!form.reportValidity()) break; const f = Object.fromEntries(new FormData(form));
        const { data, error } = await sb.from("expenses").insert({ vendor: f.vendor, date: f.date, total: num(f.total), category_id: f.category_id, product_id: f.product_id || null, payment_method_id: f.payment_method_id || null, business_purpose: f.business_purpose || null, no_receipt: true, status: "filed", ai_flags: [] }).select().single();
        if (error) throw error;
        if (form.dataset.line) await sb.from("statement_lines").update({ matched_expense_id: data.id }).eq("id", form.dataset.line);
        closeModal(); await loadAll(); render(); toast("Added");
      } break;
      case "csv": { const rows = filteredExpenses(); download(new Blob([csvOf(exportRows(rows))], { type: "text/csv" }), `JSH-expenses-${S.year}.csv`); } break;
      case "xlsx": await exportXlsx(); break;
      case "zip": await exportZip(); break;
      case "clearef": S.ef = { q: "", month: "", cat: "", prod: "", vendor: "", card: "", status: "filed" }; render(); break;
      case "milesave": {
        ev.preventDefault(); const form = $("#mileForm"); if (!form.reportValidity()) break; const f = Object.fromEntries(new FormData(form));
        const { error } = await sb.from("mileage").insert({ date: f.date, miles: num(f.miles), purpose: f.purpose, from_place: f.from_place || null, to_place: f.to_place || null, product_id: f.product_id || null });
        if (error) throw error; await loadAll(); render(); toast("Trip logged");
      } break;
      case "delmile": if (!confirm("Delete this trip?")) break; await sb.from("mileage").delete().eq("id", id); await loadAll(); render(); break;
      case "stimport": a.disabled = true; await importStatement(); a.disabled = false; break;
      case "rematch": { const n = await runMatching(); await loadAll(); render(); } break;
      case "lineadd": {
        const l = S.lines.find((x) => x.id === id); const gs = guessFromHistory(l.description);
        openManual({ vendor: gs.vendor || cleanDesc(l.description), date: l.date, total: +l.amount, category_id: gs.category_id, product_id: gs.product_id, payment_method_id: l.payment_method_id });
        $("#manForm").dataset.line = id;
      } break;
      case "lineignore": await sb.from("statement_lines").update({ ignored: true, ignore_reason: "personal" }).eq("id", id); await loadAll(); render(); break;
      case "delimport": if (!confirm("Remove this import and its lines?")) break; await sb.from("statement_imports").delete().eq("id", id); await loadAll(); render(); break;
      case "saveai": {
        const key = $("#akey").value.trim(); if (key) { const { error } = await sb.rpc("set_secret", { p_name: "anthropic_api_key", p_value: key }); if (error) throw error; $("#akey").value = ""; }
        await saveSetting("ai", { ...(S.settings.ai || {}), model: $("#aiModel").value.trim() || "claude-sonnet-5-5", auto_file_confidence: +$("#aiConf").value || 0.9 });
        toast("Saved"); wireSettings();
      } break;
      case "saveintake": { const rk = $("#rsKey").value.trim(); if (rk) { const { error } = await sb.rpc("set_secret", { p_name: "resend_api_key", p_value: rk }); if (error) throw error; $("#rsKey").value = ""; } } await saveSetting("intake", { ...(S.settings.intake || {}), address: $("#inAddr").value.trim(), resend_address: $("#inRsAddr").value.trim(), allowed_emails: $("#inEmails").value.split(/[,\s]+/).map((s) => s.trim().toLowerCase()).filter(Boolean) }); toast("Saved"); wireSettings(); break;
      case "savetwilio": {
        const sid = $("#twSid").value.trim(), tok = $("#twTok").value.trim();
        if (sid) { const { error } = await sb.rpc("set_secret", { p_name: "twilio_account_sid", p_value: sid }); if (error) throw error; }
        if (tok) { const { error } = await sb.rpc("set_secret", { p_name: "twilio_auth_token", p_value: tok }); if (error) throw error; }
        await saveSetting("intake", { ...(S.settings.intake || {}), sms_number: $("#inSms").value.trim(), allowed_phones: $("#inPhones").value.split(/[,]+/).map((s) => s.trim()).filter(Boolean) });
        $("#twSid").value = ""; $("#twTok").value = ""; toast("Saved"); wireSettings();
      } break;
      case "savebiz": {
        const rates = $("#rates").value.split("\n").map((l) => l.match(/(\d{4}-\d{2}-\d{2})\s*=\s*([\d.]+)/)).filter(Boolean).map((m) => ({ from: m[1], rate: +m[2] / 100 }));
        await saveSetting("business", { ...(S.settings.business || {}), name: $("#bizName").value.trim(), tax_form: $("#bizForm").value.trim(), start_date: $("#bizStart").value });
        await saveSetting("mileage_rates", rates); toast("Saved");
      } break;
      case "addcard": { const { error } = await sb.from("payment_methods").insert({ label: "New card", last4: null }); if (error) throw error; await loadAll(); render(); } break;
      case "savecard": { const tr = a.closest("tr"); const v = (k) => tr.querySelector(`[data-k="${k}"]`); await sb.from("payment_methods").update({ label: v("label").value, last4: v("last4").value.replace(/\D/g, "") || null, active: v("active").checked }).eq("id", id); await loadAll(); toast("Saved"); } break;
      case "addprod": { const { error } = await sb.from("products").insert({ name: "New product " + (S.prods.length + 1), sort: 100 + S.prods.length }); if (error) throw error; await loadAll(); render(); } break;
      case "saveprod": { const tr = a.closest("tr"); const v = (k) => tr.querySelector(`[data-k="${k}"]`); const { error } = await sb.from("products").update({ name: v("name").value, color: v("color").value, active: v("active").checked }).eq("id", id); if (error) throw error; await loadAll(); toast("Saved"); } break;
      case "addcat": { const { error } = await sb.from("categories").insert({ name: "New category " + (S.cats.length + 1), tax_line: "27a", sort: 500 + S.cats.length }); if (error) throw error; await loadAll(); render(); } break;
      case "savecat": { const tr = a.closest("tr"); const v = (k) => tr.querySelector(`[data-k="${k}"]`); const { error } = await sb.from("categories").update({ name: v("name").value, tax_line: v("tax_line").value || null, deductible_pct: +v("deductible_pct").value, hint: v("hint").value, active: v("active").checked }).eq("id", id); if (error) throw error; await loadAll(); toast("Saved"); } break;
      case "cparm": if (!confirm("Remove this person's access?")) break; await api("members", { action: "remove", member_id: id }); renderMembers(); toast("Removed"); break;
      case "cpapw": { const pw = genPw(); await api("members", { action: "password", member_id: id, password: pw }); prompt("New password (copy it and send it to them):", pw); } break;
    }
  } catch (e) { console.error(e); toast(e.message || "Something went wrong", 5000); }
});
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.dataset.ef) { S.ef[el.dataset.ef] = el.value; render(); return; }
  if (el.id === "stCard" && el.value === "__new") {
    const label = prompt("Card name (e.g. Amex Business)"); if (!label) { el.value = ""; return; }
    const last4 = (prompt("Last 4 digits (optional)") || "").replace(/\D/g, "").slice(-4) || null;
    const { data, error } = await sb.from("payment_methods").insert({ label, last4 }).select().single();
    if (error) return toast(error.message);
    await loadAll(); render(); $("#stCard").value = data.id;
  }
});
document.addEventListener("input", (ev) => { const el = ev.target; if (el.dataset.ef === "q") { S.ef.q = el.value; clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('[data-ef="q"]'); n.focus(); n.setSelectionRange(pos, pos); }, 250); } });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && $(".modal-bg")) closeModal(); });
async function deleteReceipt(rid) { const r = recById(rid); if (r?.storage_path) await sb.storage.from("receipts").remove([r.storage_path]); await sb.from("receipts").delete().eq("id", rid); }

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/expenses/sw.js", { scope: "/expenses/" }).catch(() => {});
boot().catch((e) => { console.error(e); $("#main").innerHTML = `<div class="auth"><div class="card stack"><h2>Couldn't load</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div></div>`; });
</script>
</body>
